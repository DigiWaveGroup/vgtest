<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a1e"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a535d"/>
      <stop offset="1" stop-color="#363d45"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a424b"/>
      <stop offset="1" stop-color="#22272d"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ff4433" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <rect width="400" height="200" fill="url(#grid)"/>
  <circle cx="200" cy="96" r="88" fill="none" stroke="#ff4433" stroke-opacity=".14" stroke-width="1" stroke-dasharray="3 7"/>
  <!-- neck -->
  <path d="M186 112h28v26c-8 7-20 7-28 0z" fill="url(#skin)"/>
  <!-- shoulders / jacket -->
  <path d="M112 200c2-34 22-54 56-62l18-4c6 9 22 9 28 0l18 4c34 8 54 28 56 62z" fill="url(#cloth)"/>
  <path d="M186 134l14 22 14-22" fill="none" stroke="#5a646f" stroke-width="2"/>
  <!-- head -->
  <ellipse cx="200" cy="80" rx="31" ry="37" fill="url(#skin)"/>
  <!-- ears -->
  <ellipse cx="169" cy="84" rx="5" ry="9" fill="#3f474f"/>
  <ellipse cx="231" cy="84" rx="5" ry="9" fill="#3f474f"/>
  <!-- hair -->
  <path d="M168 78c-3-28 12-44 33-44 22 0 36 15 32 44-4-14-14-22-30-24-14 4-26 10-35 24z" fill="#262b31"/>
  <!-- outline -->
  <path d="M112 200c2-34 22-54 56-62l18-4M288 200c-2-34-22-54-56-62l-18-4" fill="none" stroke="#ff4433" stroke-opacity=".5" stroke-width="1.5"/>
</svg>
